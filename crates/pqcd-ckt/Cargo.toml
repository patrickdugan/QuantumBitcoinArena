[package]
name = "pqcd-ckt"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Integration of pqcd authenticated label revelation with the alpenlabs/ckt gobble garbling engine"

[dependencies]
pqcd = { path = "../pqcd" }
ckt-gobble = { git = "https://github.com/alpenlabs/ckt", tag = "v0.4.0" }
bitvec = "1"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
